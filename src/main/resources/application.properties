# ── Server ──────────────────────────────────────────────────────────────────
server.port=8081

# ── SQLite Datasource ───────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:ivr-auth.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ── Session Configuration ───────────────────────────────────────────────────
ivr.session.ttl-minutes=30
ivr.session.cleanup.interval=60000

# ── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC

# ── Brand Config Directory ───────────────────────────────────────────────────
ivr.brands.config-dir=./config/brands

# ── Party Lookup ─────────────────────────────────────────────────────────────
# Development/test stub provider (derives party attributes from the caller's ANI).
# Set to false in production and wire a real PartyLookupProvider implementation —
# otherwise callers could self-select attributes that levelDetermination rules
# base auth levels on.
ivr.party-lookup.stub-enabled=true

# ── Backend Lookup Resilience (LookupExecutor) ───────────────────────────────
# Hard timeout per backend verify call; the request thread never waits longer than this.
ivr.lookup.timeout-ms=2000
# Worker pool that runs verify() calls off the servlet thread.
ivr.lookup.pool-size=16
# Circuit breaker: open after N consecutive failures, stay open for the cooldown window.
ivr.lookup.circuit.failure-threshold=5
ivr.lookup.circuit.open-seconds=30

# ── Transfer Configuration ───────────────────────────────────────────────────
ivr.transfer.config-dir=./config/transfers
